<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ปฏิทินกะงาน</title>
<meta name="theme-color" content="#fbfaf7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="กะงาน">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
:root{--bg:#fbfaf7;--card:#fff;--ink:#1f2328;--mute:#6b7078;--soft:#f4f2ed;--line:#f0eee9;--red:#b8452f;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,'Sukhumvit Set','Noto Sans Thai','Leelawadee UI',sans-serif}
main{max-width:480px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid #1f4f99;outline-offset:2px}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:16px}
.m{background:#fde3c8;color:#7a3f0c}.a{background:#d9e6fb;color:#1c4587}.n{background:#d8efd0;color:#27601b}.x{background:#e6e4df;color:#55595f}.none{background:var(--soft);color:var(--mute)}

#hint{background:#fff4d6;color:#5c4300;border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:12px}

.th-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.th-row h1{margin:0;font-size:22px;line-height:1.15}
.th-row h1 small{display:block;font-size:12px;font-weight:400;color:var(--mute);margin-top:2px}
.chip{border-radius:9px;padding:6px 12px;font-weight:700;font-size:14px;min-height:36px}
.chip small{font-weight:400;font-size:11px;margin-left:6px}
.chip.big{font-size:15px;min-height:40px;white-space:nowrap}
.picker,.quick-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip.sel{outline:2px solid var(--ink);outline-offset:1px}
.tm{display:flex;gap:8px;margin-bottom:10px}
.tf{flex:1;min-width:0;background:var(--soft);border-radius:10px;padding:6px 9px;display:flex;align-items:center;gap:6px}
.tf label{flex:1;min-width:0;font-size:11px;color:var(--mute)}
.tf input{display:block;width:100%;border:0;background:none;font:inherit;font-size:16px;font-weight:700;color:var(--ink);padding:0;min-height:26px}
.now{font-size:12px;background:var(--ink);color:#fff;border-radius:14px;padding:6px 11px;white-space:nowrap}
textarea{display:block;width:100%;border:0;border-radius:10px;background:var(--soft);padding:10px;font:inherit;font-size:16px;color:var(--ink);resize:none;min-height:76px;overflow:hidden}
.im{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pic{width:56px;height:56px;border-radius:10px;overflow:hidden;background:var(--soft)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic.add{border:1.5px dashed #b9b6ae;background:none;color:var(--mute);font-size:12px}
.sv{font-size:11px;color:var(--mute);text-align:right;margin-top:6px;min-height:16px}

.hd{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
.hd h2{margin:0;font-size:18px}
.nav{display:flex;gap:6px;align-items:center}
.nav button{min-width:36px;height:36px;border-radius:18px;background:#efede8;font-size:16px}
.nav #goToday{font-size:12px;padding:0 12px}
#quickBar{background:#eaf1fd;border-radius:14px;padding:10px;margin-bottom:8px}
#quickBar p{margin:0 0 8px;font-size:12px;color:#1c4587;display:flex;justify-content:space-between;align-items:center}
#quickDone{background:#1c4587;color:#fff;border-radius:14px;padding:5px 14px;font-size:12px}
.quick-chips{margin:0}
.g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--card);border-radius:16px;padding:6px 4px 2px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.g .h{font-size:11px;font-weight:600;text-align:center;color:var(--mute);padding:2px 0 6px}
.g .h.su{color:var(--red)}
.c{min-height:66px;padding:3px 2px 4px;border-top:1px solid var(--line);overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;text-align:left;width:100%}
.c .num{display:block;width:22px;height:22px;line-height:22px;text-align:center;font-size:12px;font-weight:600;margin:0 auto 2px;border-radius:50%}
.c.su .num{color:var(--red)}
.c.td .num{background:var(--ink);color:#fff}
.c b{display:block;border-radius:6px;text-align:center;font-size:11px;padding:1px 0;margin:0 1px}
.c p{margin:3px 1px 0;font-size:9.5px;line-height:1.25;color:#4b5058;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;overflow-wrap:anywhere}
.c .ph{position:absolute;top:5px;right:3px;width:7px;height:6px;border-radius:2px;background:var(--mute)}
.lg{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:var(--mute);margin:10px 0 4px}
.lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
#quickOpen{display:block;margin:4px auto 16px;font-size:13px;color:#1c4587;padding:8px 14px}

.st{font-size:14px;font-weight:700;margin:0 4px 8px;display:flex;justify-content:space-between}
.st small{font-weight:400;color:var(--mute)}
.r{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);border-radius:14px;padding:10px;margin-bottom:6px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.r .d{width:36px;text-align:center;line-height:1.15;flex:none}
.r .d strong{display:block;font-size:19px}
.r .d small{font-size:11px;color:var(--mute)}
.r .t{flex:1;min-width:0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.r .meta{display:block;font-size:11px;color:var(--mute);margin-bottom:2px;white-space:normal}
.r .meta b{border-radius:5px;padding:0 6px;margin-right:5px}
.r .im{margin-top:6px}
.r .pic{width:44px;height:44px}
.empty{text-align:center;color:var(--mute);font-size:13px;padding:14px 0}

footer{margin-top:18px;text-align:center}
footer .btns{display:flex;justify-content:center;gap:10px}
footer button{background:#efede8;border-radius:12px;padding:10px 16px;font-size:13px}
#backupLine{font-size:12px;color:var(--mute);margin:8px 0 0}
#backupLine.warn{color:var(--red)}

dialog{border:0;padding:0;color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
#sheet{margin:auto auto 0;width:100%;max-width:480px;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;background:var(--bg);padding:10px 14px calc(14px + env(safe-area-inset-bottom))}
#sheet .bar{display:flex;justify-content:flex-end;margin-bottom:8px}
#sheetClose,#viewer button{background:var(--ink);color:#fff;border-radius:14px;padding:7px 16px;font-size:13px}
#sheet .card{margin-bottom:0}
#viewer{background:#111;max-width:100vw;max-height:100dvh;width:100vw;height:100dvh;margin:0}
#viewer img{width:100%;height:calc(100dvh - 70px - env(safe-area-inset-bottom));object-fit:contain;display:block}
#viewer .bar{display:flex;justify-content:space-between;padding:14px}
#viewer #viewerDel{background:#7a1f12}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:10px 16px;font-size:13px;max-width:90vw;z-index:9;pointer-events:none}
#toast:empty{display:none}
</style>
</head>
<body>
<main>
  <div id="hint" hidden>เพื่อไม่ให้ข้อมูลหาย: กดปุ่มแชร์ของ Safari แล้วเลือก “เพิ่มไปยังหน้าจอโฮม” จากนั้นเปิดแอปจากไอคอนนั้นเสมอ</div>

  <section id="today" class="card" aria-label="วันนี้"></section>

  <section aria-label="ปฏิทินเดือน">
    <div class="hd">
      <h2 id="title"></h2>
      <div class="nav">
        <button type="button" id="prev" aria-label="เดือนก่อนหน้า">‹</button>
        <button type="button" id="goToday">วันนี้</button>
        <button type="button" id="next" aria-label="เดือนถัดไป">›</button>
      </div>
    </div>
    <div id="quickBar" hidden>
      <p><span>เลือกกะ แล้วแตะวันที่ต้องการ</span><button type="button" id="quickDone">เสร็จ</button></p>
      <div class="quick-chips" id="quickChips"></div>
    </div>
    <div class="g" id="grid"></div>
    <div class="lg"><span><i class="m"></i>เช้า</span><span><i class="a"></i>กลาง</span><span><i class="n"></i>ดึก</span><span><i class="x"></i>หยุด/ลา</span></div>
    <button type="button" id="quickOpen">⚡ ใส่กะแบบเร็ว</button>
  </section>

  <section aria-label="บันทึกเดือนนี้">
    <div class="st">บันทึกเดือนนี้ <small id="noteCount"></small></div>
    <div id="notes"></div>
  </section>

  <footer>
    <div class="btns">
      <button type="button" id="exportBtn">สำรองข้อมูล</button>
      <button type="button" id="importBtn">นำเข้าข้อมูล</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
    <p id="backupLine"></p>
  </footer>
</main>

<dialog id="sheet" aria-label="แก้ไขวัน">
  <div class="bar"><button type="button" id="sheetClose">เสร็จ</button></div>
  <div id="sheetBody" class="card"></div>
</dialog>

<dialog id="viewer" aria-label="ภาพแนบ">
  <img alt="ภาพแนบ">
  <div class="bar"><button type="button" id="viewerDel">ลบภาพ</button><button type="button" id="viewerClose">ปิด</button></div>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
